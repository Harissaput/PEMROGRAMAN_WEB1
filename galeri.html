<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeri KOPARA Coffee</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <!-- BODY START -->
  <body>

    <!-- HEADER / NAVBAR SECTION START -->
    <header class="nav">
      <div class="logo-container brand">
        <img src="assets/images/logo_kopara_2-removebg-preview.png" alt="Logo KOPARA Coffee" class="nav-logo" width="707" height="353">
      </div>
      <nav aria-label="Navigasi utama">
        <ul>
          <li><a href="index.html">Beranda</a></li>
          <li><a href="tentang.html">Tentang Kami</a></li>
          <li><a href="galeri.html" aria-current="page">Galeri</a></li>
          <li><a href="produk.html">Produk</a></li>
          <li><a href="kontak.html">Kontak</a></li>
        </ul>
      </nav>
    </header>
    <!-- HEADER / NAVBAR SECTION END -->

    <!-- MAIN CONTENT START -->
    <main>

      <!-- GALERI FOTO SECTION START -->
      <section aria-labelledby="media-title">
        <h2 id="media-title">Media Usaha</h2>

        <div class="gallery-grid">
          <figure class="media-card">
            <img
              src="assets/images/galery_2.png"
              alt="Etalase KOPARA Coffee berisi berbagai produk kopi"
              width="500"
              height="667"
              loading="lazy"
            />
            <figcaption>Etalase produk KOPARA Coffee.</figcaption>
          </figure>

          <figure class="media-card">
            <img
              src="assets/images/galery_1.png"
              alt="Barista menuang air panas ke dripper kopi"
              width="500"
              height="333"
              loading="lazy"
            />
            <figcaption>Proses seduh manual kopi KOPARA.</figcaption>
          </figure>
        </div>
      </section>
      <!-- GALERI FOTO SECTION END -->

      <!-- AUDIO SECTION START -->
      <section aria-labelledby="audio-title">
        <h2 id="audio-title">Nada Penanda Kedai</h2>

        <p id="audio-note">
          Nada uji singkat untuk memeriksa elemen audio dan kontrol browser.
        </p>

        <audio
          controls
          aria-describedby="audio-note"
          src="assets/Audio/Audio_galeri.mp3"
        >
          Browser Anda tidak mendukung pemutar audio.
        </audio>
      </section>
      <!-- AUDIO SECTION END -->

    </main>
    <!-- MAIN CONTENT END -->

    <!-- FOOTER SECTION START -->
    <footer>
      <p>&copy; 2026 KOPARA Coffee  Pekalongan, Jawa Tengah</p>
    </footer>
    <!-- FOOTER SECTION END -->

  </body>
  <!-- BODY END -->
</html>
