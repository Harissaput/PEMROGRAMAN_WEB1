<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produk kami</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<!-- BODY START -->
<body>

  <!-- HEADER / NAVBAR SECTION START -->
  <header>
    <div class="logo-container">
      <img src="assets/images/logo_kopara_2-removebg-preview.png" alt="Logo KOPARA Coffee" class="nav-logo">
    </div>
    <nav aria-label="Navigasi utama">
      <ul>
        <li><a href="index.html">Beranda</a></li>
        <li><a href="tentang.html">Tentang Kami</a></li>
        <li><a href="galeri.html">Galeri</a></li>
        <li><a href="produk.html" aria-current="page">Produk</a></li>
        <li><a href="kontak.html">Kontak</a></li>
      </ul>
    </nav>
  </header>
  <!-- HEADER / NAVBAR SECTION END -->

  <!-- MAIN CONTENT START -->
  <main>

    <!-- PRODUK UNGGULAN SECTION START -->
    <section id="produk">
      <h2>Produk Unggulan</h2>

      <div class="produk-list" style="display: flex; gap: 24px; flex-wrap: wrap;">
        <figure class="produk-figure" style="flex: 1; min-width: 280px;">
          <img
            src="assets/images/produk_1.png"
            alt=" kemasan produk kopi lokal"
            style="max-width: 100%; height: auto;"
          >
          <figcaption>Paket kopi pilihan siap kirim.</figcaption>
        </figure>

        <figure class="produk-figure" style="flex: 1; min-width: 280px;">
          <img
            src="assets/images/produk_2.png"
            alt="produk kopi nusantara pilihan"
            style="max-width: 100%; height: auto;"
          >
          <figcaption>kopi nusantara pilihan.</figcaption>
        </figure>
      </div>
    </section>
    <!-- PRODUK UNGGULAN SECTION END -->

    <!-- DAFTAR HARGA SECTION START -->
    <section id="harga">
      <h2>Daftar Harga</h2>

      <table class="tabel-harga">
        <caption>Harga&produk</caption>

        <thead>
          <tr>
            <th scope="col">Produk</th>
            <th scope="col">Harga</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <th scope="row">Kopi KAMPOENGG</th>
            <td>Rp100.000</td>
          </tr>
        </tbody>

        <tbody>
          <tr>
            <th scope="row">Americano instan </th>
            <td>Rp55.000</td>
          </tr>
        </tbody>

        <tbody>
          <tr>
            <th scope="row">Kopi KOPARA</th>
            <td>Rp20.000</td>
          </tr>
        </tbody>

      </table>
    </section>
    <!-- DAFTAR HARGA SECTION END -->

  </main>
  <!-- MAIN CONTENT END -->

  <!-- FOOTER SECTION START -->
  <footer>
    <p>&copy; 2026 KOPARA Coffee — UMKM Pekalongan, Jawa Tengah</p>
  </footer>
  <!-- FOOTER SECTION END -->

</body>
<!-- BODY END -->
</html>
